<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>Quality Assurance Dashboard - Area Jabo 2</title>
  
  <meta name="description" content="Sistem Pemantauan Kualitas & Kepatuhan - Pantau hasil temuan, skor indeks kualitas 9 cabang Area Jabo 2, dan pencapaian TQA karyawan secara real-time." />
  <meta name="keywords" content="Quality Assurance, QA Dashboard, Mutu Kepatuhan, Area Jabo 2, TQA, Pemantauan Cabang" />
  <meta name="author" content="Quality Assurance Area Jabo 2" />
  <meta name="theme-color" content="#0b1329" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Quality Assurance Dashboard - Area Jabo 2" />
  <meta property="og:description" content="Sistem Pemantauan Kualitas & Kepatuhan Terpadu Area Jabo 2." />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Quality Assurance Dashboard - Area Jabo 2" />
  <meta name="twitter:description" content="Sistem Pemantauan Kualitas & Kepatuhan Terpadu Area Jabo 2." />

  <!-- Favicon SVG (Modern QA 3D Stack Badge) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><path d='M16 6L6 11l10 5 10-5-10-5zM6 16l10 5 10-5M6 21l10 5 10-5' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />

  <style>
    /* ==========================================================================
       RESET & FULL-SCREEN LAYOUT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b1329;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       FULLSCREEN RESPONSIVE IFRAME
       ========================================================================== */
    .app-iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    #app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background-color: transparent;
    }

    /* ==========================================================================
       PRELOADER / SPLASH OVERLAY (SMOOTH INITIAL BOOT)
       ========================================================================== */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1e3a8a 0%, #0b1329 70%, #060913 100%);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
      color: #ffffff;
      user-select: none;
    }

    #app-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.5rem;
      max-width: 360px;
    }

    .splash-badge {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 14px 28px -6px rgba(37, 99, 235, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.2);
      animation: floatBadge 3.2s ease-in-out infinite;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .splash-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }

    .splash-subtitle {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 1.75rem;
      font-weight: 500;
    }

    /* SLIM PROGRESS BAR */
    .splash-progress-track {
      width: 190px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 1rem;
    }

    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #60a5fa, #38bdf8);
      animation: indeterminateBar 1.6s infinite ease-in-out;
    }

    @keyframes indeterminateBar {
      0% { left: -45%; width: 45%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 45%; }
    }

    .splash-status {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    /* ==========================================================================
       FAILSAFE NOTICE (APPEARS AFTER 8 SECONDS IF CLOUD IS BLOCKED)
       ========================================================================== */
    .failsafe-link {
      display: none;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #93c5fd;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
  </style>
</head>

<body>

  <!-- PRELOADER SPLASH SCREEN -->
  <div id="app-splash">
    <div class="splash-glow"></div>
    <div class="splash-content">
      <div class="splash-badge">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="splash-title">Quality Assurance</h1>
      <p class="splash-subtitle">Area Jabo 2 • Dashboard</p>
      
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-status" id="splash-status-text">Menghubungkan ke server...</div>

      <button type="button" id="btn-failsafe" class="failsafe-link" onclick="handleDirectOpen()">
        Buka Langsung di Tab Baru &rarr;
      </button>
    </div>
  </div>

  <!-- IFRAME CONTAINER -->
  <div class="app-iframe-container">
    <iframe 
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycbzzIwYLANqGk5MEKQUyMWDAAIgyqHlDvWCia5wvxnptVuhmfUZpFWlsPlRFI9DRs-8lxw/exec"
      title="Quality Assurance Dashboard - Area Jabo 2"
      allow="clipboard-read; clipboard-write; camera; microphone; fullscreen; geolocation; web-share"
      loading="eager">
    </iframe>
  </div>

  <script>
    (function () {
      const splash = document.getElementById('app-splash');
      const frame = document.getElementById('app-frame');
      const statusText = document.getElementById('splash-status-text');
      const btnFailsafe = document.getElementById('btn-failsafe');

      let isLoaded = false;

      function dismissSplash() {
        if (isLoaded) return;
        isLoaded = true;
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(() => {
            splash.style.display = 'none';
          }, 500);
        }
      }

      // 1. Event normal saat iframe selesai load
      if (frame) {
        frame.addEventListener('load', function () {
          if (statusText) statusText.textContent = 'Memuat tampilan...';
          setTimeout(dismissSplash, 600);
        });
      }

      // 2. Failsafe timeout: Setelah 4.5 detik, splash otomatis ditutup agar tidak menghalangi jika iframe memblokir event load
      setTimeout(function () {
        dismissSplash();
      }, 4500);

      // 3. Cadangan link manual jika browser pengguna memblokir iframe pihak ketiga
      setTimeout(function () {
        if (btnFailsafe) {
          btnFailsafe.style.display = 'inline-block';
        }
      }, 7000);

      window.handleDirectOpen = function () {
        window.open('https://script.google.com/macros/s/AKfycbzBxod6B1L6bfBTqIMlATSi4NQkXv-BLiFUxMscwPwol9qscMDCHhYZbkJmMiZbR9dQ/exec', '_blank');
      };
    })();
  </script>

</body>

</html>
